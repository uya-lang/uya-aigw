# aigw 部署参考：nginx 反代 1 controller + N edge node（B6）
#
# 分流策略：
#   /controller/*  → controller（只允许内网）
#   其余           → edge 节点池（least_conn，SSE 需要 proxy_buffering off）
upstream aigw_edges {
    least_conn;
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;
    keepalive 64;
}

upstream aigw_controller {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name aigw.local;

    client_max_body_size 8m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";

    # SSE：关缓冲、长超时，避免流式被攒包
    location /v1/ {
        proxy_pass http://aigw_edges;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    # UI 与其余接口
    location / {
        proxy_pass http://aigw_edges;
    }

    # 控制面只开放给内网（示例：仅 10.0.0.0/8）
    location /controller/ {
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://aigw_controller;
    }
}
